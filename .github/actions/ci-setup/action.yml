name: CI toolchain and caches
description: Configure Python, SwiftPM products and independently pinned engine archives
inputs:
  mode:
    description: Cache namespace for this build mode
    required: true
  products:
    description: Mode-specific SwiftPM scratch directory
    default: .build
  tools:
    description: Install checksum-pinned fast-check tools
    default: 'false'
runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      with:
        version: '0.13.8'
        enable-cache: true
        python-version: '3.13'
        cache-python: true
        cache-dependency-glob: scripts/*requirements.txt
    - name: Restore Python environment for locked requirements
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: .venv
        key: python-${{ runner.os }}-${{ runner.arch }}-3.13-${{ inputs.mode == 'codeql' && 'stdlib' || inputs.mode == 'engine-probe' && 'stdlib' || inputs.mode == 'shipping' && 'shipping' || 'release' }}-${{ hashFiles('scripts/*requirements.txt') }}
    - name: Configure Python and report toolchain
      id: toolchain
      shell: bash
      env:
        CI_MODE: ${{ inputs.mode }}
      run: |
        python3 scripts/install-ci-python.py 3.13
        if [[ ! -x .venv/bin/python ]]; then uv venv --python 3.13 .venv; fi
        requirements=(scripts/release-requirements.txt)
        if [[ "$CI_MODE" == shipping ]]; then requirements+=(scripts/sbom-requirements.txt); fi
        if [[ "$CI_MODE" != codeql && "$CI_MODE" != engine-probe ]]; then
          uv pip sync --python .venv/bin/python --require-hashes --only-binary=:all: "${requirements[@]}"
        fi
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
        echo "PYTHON=$PWD/.venv/bin/python" >> "$GITHUB_ENV"
        if [[ "$RUNNER_OS" == macOS ]]; then xcodebuild -version; fi
        swift --version
        .venv/bin/python --version
        toolchain=$( { if [[ "$RUNNER_OS" == macOS ]]; then xcodebuild -version; fi; swift --version; } | shasum -a 256 | cut -d ' ' -f 1)
        echo "identity=$toolchain" >> "$GITHUB_OUTPUT"
        echo "CI_TOOLCHAIN_ID=$toolchain" >> "$GITHUB_ENV"
        {
          echo '### Toolchain'
          echo '```text'
          if [[ "$RUNNER_OS" == macOS ]]; then xcodebuild -version; fi
          swift --version
          .venv/bin/python --version
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Cache SwiftPM products for this source and mode
      if: inputs.mode != 'fast' && inputs.mode != 'codeql' && inputs.mode != 'engine-probe'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ inputs.products }}
        key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.identity }}-${{ inputs.mode }}-${{ hashFiles('Package.swift', 'Package.resolved', 'Sources/**', 'Tests/**', 'Plugins/**') }}
        restore-keys: |
          swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.identity }}-${{ inputs.mode }}-
    - name: Cache SwiftPM dependencies without compiled app objects
      if: inputs.mode != 'fast' && inputs.mode != 'engine-probe'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: |
          ~/Library/Caches/org.swift.swiftpm
          ~/.cache/org.swift.swiftpm
        key: swift-dependencies-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.identity }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
        restore-keys: |
          swift-dependencies-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.identity }}-
    - name: Cache pinned engine archive independently
      if: inputs.mode == 'fast' || inputs.mode == 'verification' || inputs.mode == 'shipping'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: build/EngineCache/*.tar.xz
        key: engine-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ThirdParty/ChromiumEngine/pin.json') }}
    - name: Cache checksum-pinned fast-check archives
      if: inputs.tools == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: build/ci-tool-archives
        key: ci-tool-archives-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ci-tools.json') }}
        restore-keys: |
          ci-tool-archives-v1-${{ runner.os }}-${{ runner.arch }}-
    - name: Install verified fast-check binaries
      if: inputs.tools == 'true'
      shell: bash
      run: |
        .venv/bin/python scripts/install-ci-tools.py --cache-directory build/ci-tool-archives
        echo "$PWD/build/ci-tools" >> "$GITHUB_PATH"
