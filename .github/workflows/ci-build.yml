name: Build and tests
on:
  workflow_call:
    inputs:
      base_sha:
        description: Immutable source revision used for the coverage baseline
        type: string
        required: true
    outputs:
      coverage:
        description: Whether the no-regression coverage comparison passed
        value: ${{ jobs.compare.outputs.coverage }}
permissions:
  contents: read
jobs:
  unit:
    name: Swift build and unit tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
        with:
          mode: unit-coverage
      - name: Build then run unit tests with coverage and JUnit
        env:
          SWIFT_BACKTRACE: enable=yes,interactive=no,color=no,output-to=stderr,limit=128,top=0
        run: .venv/bin/python scripts/ci-stage.py unit
      - uses: ./.github/actions/ci-evidence
        if: always()
        with:
          stage: unit
          extra-path: build/Verification/sidebar-dnd
      - name: Upload candidate coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage-candidate-${{ github.run_id }}
          path: |
            build/ci/unit/coverage.json
            build/ci/unit/metadata.json
          if-no-files-found: error

  base:
    name: Immutable base coverage tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
        with:
          mode: coverage-base
          products: build/swiftpm/coverage-base
      - name: Build and test immutable base with coverage
        env:
          CI_BASE_SHA: ${{ inputs.base_sha }}
        run: .venv/bin/python scripts/ci-stage.py coverage-base
      - uses: ./.github/actions/ci-evidence
        if: always()
        with:
          stage: coverage-base
      - name: Upload immutable base coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage-base-${{ github.run_id }}
          path: |
            build/ci/coverage-base/coverage.json
            build/ci/coverage-base/metadata.json
          if-no-files-found: error

  compare:
    name: Compare module line coverage
    needs: [unit, base]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      coverage: ${{ steps.coverage.outputs.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: coverage-candidate-${{ github.run_id }}
          path: build/ci/unit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: coverage-base-${{ github.run_id }}
          path: build/ci/coverage-base
      - name: Compare module line coverage
        id: coverage
        run: |
          python3 scripts/ci-stage.py coverage-compare
          echo "result=passed" >> "$GITHUB_OUTPUT"
