name: CodeQL
on:
  workflow_call:
    inputs:
      swift:
        description: Trace Swift sources for this selected diff
        type: boolean
        default: true
permissions:
  contents: read
  security-events: write
jobs:
  analyze:
    name: CodeQL ${{ matrix.language }}
    runs-on: ${{ matrix.language == 'swift' && 'macos-26-intel' || 'ubuntu-24.04' }}
    env:
      CI_SWIFT_SCOPE: all
    timeout-minutes: ${{ matrix.language == 'swift' && 60 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        language: ${{ inputs.swift && fromJSON('["swift","python","actions"]') || fromJSON('["python","actions"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
        if: matrix.language == 'swift'
        with:
          mode: codeql
          products: build/swiftpm/codeql
      - name: Cache native SwiftPM build prerequisites
        if: matrix.language == 'swift'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: build/swiftpm/codeql-semantic
          key: codeql-native-${{ runner.os }}-${{ runner.arch }}-${{ env.CI_TOOLCHAIN_ID }}-${{ hashFiles('scripts/codeql-build.py', 'Package.swift', 'Package.resolved', 'Plugins/**', 'Sources/**', 'Tests/**') }}
          restore-keys: |
            codeql-native-${{ runner.os }}-${{ runner.arch }}-${{ env.CI_TOOLCHAIN_ID }}-
      - name: Build prerequisites and bind every Swift compiler command before tracing
        if: matrix.language == 'swift'
        run: .venv/bin/python scripts/codeql-build.py prepare --scope "$CI_SWIFT_SCOPE"
      - name: Initialize CodeQL
        id: init
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'swift' && 'manual' || 'none' }}
      - name: Cache SDK modules for this extractor and target
        if: matrix.language == 'swift'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: build/codeql-sdk-modules
          key: codeql-sdk-${{ runner.os }}-${{ runner.arch }}-${{ env.CI_TOOLCHAIN_ID }}-${{ steps.init.outputs.codeql-version }}-arm64-v1
      - name: Freshly extract every Swift source into one database
        if: matrix.language == 'swift'
        run: .venv/bin/python scripts/codeql-build.py semantic
      - name: Analyze
        id: analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          category: /language:${{ matrix.language }}
      - name: Require extraction of every tracked Swift source
        if: matrix.language == 'swift'
        env:
          CODEQL: ${{ steps.init.outputs.codeql-path }}
          DATABASE: ${{ fromJSON(steps.analyze.outputs.db-locations).swift }}
        run: |
          mkdir -p build/ci/codeql-swift
          "$CODEQL" bqrs decode --format=json --output=build/ci/codeql-swift/extracted.json "$DATABASE/results/codeql/swift-queries/diagnostics/ExtractedFiles.bqrs"
          .venv/bin/python scripts/check-codeql-extraction.py build/ci/codeql-swift/extracted.json --scope "$CI_SWIFT_SCOPE"
      - uses: ./.github/actions/ci-evidence
        if: always() && matrix.language == 'swift'
        with:
          stage: codeql-swift
          extra-path: build/ci/codeql-prepare
