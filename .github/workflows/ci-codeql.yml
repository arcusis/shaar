name: CodeQL
on:
  workflow_call:
    inputs:
      swift:
        description: Trace Swift sources for this selected diff
        type: boolean
        default: true
permissions:
  contents: read
  security-events: write
jobs:
  analyze:
    name: CodeQL ${{ matrix.language }}
    runs-on: ${{ matrix.language == 'swift' && 'macos-26' || 'ubuntu-24.04' }}
    timeout-minutes: ${{ matrix.language == 'swift' && 60 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        language: ${{ inputs.swift && fromJSON('["swift","python","actions"]') || fromJSON('["python","actions"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
        if: matrix.language == 'swift'
        with:
          mode: codeql
          products: build/swiftpm/codeql
      - name: Resolve immutable dependencies before tracing manifests
        if: matrix.language == 'swift'
        run: swift package --scratch-path build/swiftpm/codeql --force-resolved-versions resolve
      - name: Initialize CodeQL
        id: init
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'swift' && 'manual' || 'none' }}
      - name: Trace a fresh Swift build
        if: matrix.language == 'swift'
        run: >-
          swift build --build-system native --jobs 2 --force-resolved-versions --scratch-path build/swiftpm/codeql
          --disable-index-store -Xswiftc -whole-module-optimization -Xswiftc -Onone -Xswiftc -num-threads -Xswiftc 2
      - name: Analyze
        id: analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          category: /language:${{ matrix.language }}
      - name: Require extraction of every tracked Swift source
        if: matrix.language == 'swift'
        env:
          CODEQL: ${{ steps.init.outputs.codeql-path }}
          DATABASE: ${{ fromJSON(steps.analyze.outputs.db-locations).swift }}
        run: |
          mkdir -p build/ci/codeql-swift
          "$CODEQL" bqrs decode --format=json --output=build/ci/codeql-swift/extracted.json "$DATABASE/results/codeql/swift-queries/diagnostics/ExtractedFiles.bqrs"
          .venv/bin/python scripts/check-codeql-extraction.py build/ci/codeql-swift/extracted.json
      - uses: ./.github/actions/ci-evidence
        if: always() && matrix.language == 'swift'
        with:
          stage: codeql-swift
