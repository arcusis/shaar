name: Engine verification bundle
on:
  workflow_call:
    inputs:
      iterations:
        description: Requested repetitions; private-window and Quit run at least three
        type: number
        default: 1
    outputs:
      shards:
        description: Four balanced engine probe shards
        value: ${{ jobs.prepare.outputs.shards }}
permissions:
  contents: read
jobs:
  prepare:
    name: Build shared verification bundle
    permissions:
      actions: read
      contents: read
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      shards: ${{ steps.bundle.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Identify verification bundle build inputs
        run: echo "CI_BUNDLE_INPUTS=${{ hashFiles('Package.swift', 'Package.resolved', 'Sources/**', 'Tests/**', 'Resources/**', 'Plugins/**', 'ThirdParty/ChromiumEngine/**', 'ThirdParty/FrameworkDevTools/**', 'scripts/fetch-framework-devtools.py', 'scripts/bundle-app.sh', 'scripts/ci-stage.py', 'scripts/release-config.sh', 'scripts/engine-signing.sh', 'scripts/fetch-engine.sh', 'scripts/rebrand-engine-framework.py', 'scripts/engine_payload.py', 'scripts/verify_engine_bundle.py', 'scripts/stage-browser-resources.py', 'scripts/release_feed.py') }}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/ci-setup
        with:
          mode: verification
          products: build/swiftpm/verification
      - name: Identify exact source tree for bundle reuse
        id: source-tree
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "CI_SOURCE_TREE=$tree" >> "$GITHUB_ENV"
      - name: Restore exact-tree verification bundle
        id: bundle-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            build/ci/engine-build/bundle.json
            build/ci/engine-build/verification.tar.gz
          key: engine-bundle-${{ runner.os }}-${{ runner.arch }}-${{ env.CI_TOOLCHAIN_ID }}-${{ steps.source-tree.outputs.tree }}-${{ hashFiles('Package.swift', 'Package.resolved', 'Sources/**', 'Tests/**', 'Resources/**', 'Plugins/**', 'ThirdParty/ChromiumEngine/**', 'ThirdParty/FrameworkDevTools/**', 'scripts/fetch-framework-devtools.py', 'scripts/bundle-app.sh', 'scripts/ci-stage.py', 'scripts/release-config.sh', 'scripts/engine-signing.sh', 'scripts/fetch-engine.sh', 'scripts/rebrand-engine-framework.py', 'scripts/engine_payload.py', 'scripts/verify_engine_bundle.py', 'scripts/stage-browser-resources.py', 'scripts/release_feed.py') }}-${{ hashFiles('ThirdParty/ChromiumEngine/pin.json') }}
      - name: Find the matching successful PR bundle for this merge group
        id: pr-bundle-run
        if: github.event_name == 'merge_group' && steps.bundle-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 2
        env:
          QUEUE_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          head_ref="${QUEUE_HEAD_REF#refs/heads/}"
          if [[ ! "$head_ref" =~ ^gh-readonly-queue/production/pr-([0-9]+)-([0-9a-f]{40})$ ]]; then
            echo "run_id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          queue_pr="${BASH_REMATCH[1]}"
          source_sha="${BASH_REMATCH[2]}"
          runs_file="$RUNNER_TEMP/source-checks-runs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/source-checks.yml/runs?event=pull_request&head_sha=$source_sha&per_page=100" > "$runs_file"
          run_id=$(python3 scripts/ci_engine.py select-pr-bundle-run "$runs_file" "$queue_pr" "$GITHUB_REPOSITORY")
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Download the verified bundle artifact from the matching PR run
        if: github.event_name == 'merge_group' && steps.bundle-cache.outputs.cache-hit != 'true' && steps.pr-bundle-run.outputs.run_id != ''
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ci-engine-build-${{ steps.pr-bundle-run.outputs.run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.pr-bundle-run.outputs.run_id }}
          path: build/ci/engine-build
      - name: Build or reuse bundle bound to source tree, build inputs, engine and toolchain
        id: bundle
        env:
          CI_ITERATIONS: ${{ inputs.iterations }}
        run: .venv/bin/python scripts/ci-stage.py engine-build --iterations "$CI_ITERATIONS"
      - uses: ./.github/actions/ci-evidence
        if: always()
        with:
          stage: engine-build
          compression-level: '0'
          artifact-name: ci-engine-build-${{ github.run_id }}
          overwrite: 'true'
