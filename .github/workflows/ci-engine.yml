name: Engine simulations
on:
  workflow_call:
    inputs:
      iterations:
        description: Requested repetitions; private-window and Quit run at least three
        type: number
        default: 1
      shards:
        description: Shard list emitted by the shared verification bundle workflow
        type: string
        required: true
permissions:
  actions: read
  contents: read
jobs:
  probes-initial:
    name: Engine shard ${{ matrix.shard }}
    runs-on: macos-26
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: ${{ fromJSON(inputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Identify verification bundle build inputs
        run: echo "CI_BUNDLE_INPUTS=${{ hashFiles('Package.swift', 'Package.resolved', 'Sources/**', 'Tests/**', 'Resources/**', 'Plugins/**', 'ThirdParty/ArdiaCore/**', 'scripts/bundle-app.sh', 'scripts/ci-stage.py', 'scripts/release-config.sh', 'scripts/engine-signing.sh', 'scripts/fetch-engine.sh', 'scripts/stage-browser-resources.py', 'scripts/release_feed.py') }}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/ci-setup
        with:
          mode: engine-probe
      - name: Identify exact source tree for bundle validation
        run: echo "CI_SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ci-engine-build-${{ github.run_id }}
          path: build/ci/engine-build
      - name: Verify shared bundle and run initial phase without retries
        env:
          CI_ITERATIONS: ${{ inputs.iterations }}
          CI_SHARD: ${{ matrix.shard }}
        run: .venv/bin/python scripts/ci-stage.py engine-shard --iterations "$CI_ITERATIONS" --shard "$CI_SHARD"
      - uses: ./.github/actions/ci-evidence
        if: always()
        with:
          stage: engine-shard-${{ matrix.shard }}
