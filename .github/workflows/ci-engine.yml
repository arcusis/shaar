name: Engine simulations
on:
  workflow_call:
    inputs:
      iterations:
        description: Requested repetitions; private-window and Quit run at least three
        type: number
        default: 1
permissions:
  contents: read
jobs:
  prepare:
    name: Build shared verification bundle
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      shards: ${{ steps.bundle.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Identify verification bundle build inputs
        run: echo "CI_BUNDLE_INPUTS=${{ hashFiles('Package.swift', 'Package.resolved', 'Sources/**', 'Tests/**', 'Resources/**', 'Plugins/**', 'ThirdParty/ArdiaCore/**', 'scripts/bundle-app.sh', 'scripts/ci-stage.py', 'scripts/release-config.sh', 'scripts/engine-signing.sh', 'scripts/fetch-engine.sh', 'scripts/stage-browser-resources.py', 'scripts/release_feed.py') }}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/ci-setup
        with:
          mode: verification
          products: build/swiftpm/verification
      - name: Restore verification bundle for identical build inputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            build/ci/engine-build/bundle.json
            build/ci/engine-build/verification.tar.gz
          key: engine-bundle-${{ runner.os }}-${{ runner.arch }}-${{ env.CI_TOOLCHAIN_ID }}-${{ hashFiles('Package.swift', 'Package.resolved', 'Sources/**', 'Tests/**', 'Resources/**', 'Plugins/**', 'ThirdParty/ArdiaCore/**', 'scripts/bundle-app.sh', 'scripts/ci-stage.py', 'scripts/release-config.sh', 'scripts/engine-signing.sh', 'scripts/fetch-engine.sh', 'scripts/stage-browser-resources.py', 'scripts/release_feed.py') }}
      - name: Build or reuse bundle bound to build inputs, engine and toolchain
        id: bundle
        env:
          CI_ITERATIONS: ${{ inputs.iterations }}
        run: .venv/bin/python scripts/ci-stage.py engine-build --iterations "$CI_ITERATIONS"
      - uses: ./.github/actions/ci-evidence
        if: always()
        with:
          stage: engine-build
          compression-level: '0'
          artifact-name: ci-engine-build-${{ github.run_id }}
          overwrite: 'true'
  probes:
    name: Engine ${{ matrix.shard }}
    needs: prepare
    runs-on: macos-26
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Identify verification bundle build inputs
        run: echo "CI_BUNDLE_INPUTS=${{ hashFiles('Package.swift', 'Package.resolved', 'Sources/**', 'Tests/**', 'Resources/**', 'Plugins/**', 'ThirdParty/ArdiaCore/**', 'scripts/bundle-app.sh', 'scripts/ci-stage.py', 'scripts/release-config.sh', 'scripts/engine-signing.sh', 'scripts/fetch-engine.sh', 'scripts/stage-browser-resources.py', 'scripts/release_feed.py') }}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/ci-setup
        with:
          mode: engine-probe
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ci-engine-build-${{ github.run_id }}
          path: build/ci/engine-build
      - name: Verify shared bundle and run assigned iterations without retries
        env:
          CI_ITERATIONS: ${{ inputs.iterations }}
          CI_SHARD: ${{ matrix.shard }}
        run: .venv/bin/python scripts/ci-stage.py engine-shard --iterations "$CI_ITERATIONS" --shard "$CI_SHARD"
      - uses: ./.github/actions/ci-evidence
        if: always()
        with:
          stage: engine-shard-${{ matrix.shard }}
