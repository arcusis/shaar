name: Native Bitwarden strict Controller

on:
  workflow_dispatch:
  pull_request:
    branches:
      - production
      - 'feat/native-*'

permissions:
  contents: read

jobs:
  strict-controller:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Check out exact workflow revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Set up Python
        id: python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Verify checkout and record reviewed input checkpoint
        id: input-checkpoint
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -eu
          mkdir -p build
          mkdir build/NativeBitwardenStrictSDK10
          mkdir "$RUNNER_TEMP/strict-home"
          git_clean() {
            /usr/bin/env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin HOME="$RUNNER_TEMP/strict-home" TMPDIR="$RUNNER_TEMP" GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 git "$@"
          }
          test "$(git_clean rev-parse HEAD)" = "$GITHUB_SHA"
          git_clean diff --no-ext-diff --no-textconv --exit-code
          git_clean diff --cached --no-ext-diff --no-textconv --exit-code
          /usr/bin/env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin HOME="$RUNNER_TEMP/strict-home" TMPDIR="$RUNNER_TEMP" GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 "$PYTHON" -B - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          files = ('scripts/build-native-bitwarden-strict-sdk.py',
                   'scripts/prepare-native-bitwarden-hosted-inputs.py',
                   'ThirdParty/BitwardenStrictEditSpike/hosted-inputs.pin.json',
                   'ThirdParty/BitwardenStrictEditSpike/hosted-sdk10-inputs.pin.json')
          hashes = {}
          for name in files:
              item = pathlib.Path(name)
              if item.is_symlink() or not item.is_file():
                  raise ValueError('unsafe checkpoint input')
              data = item.read_bytes()
              if data != subprocess.check_output(['git', 'show', commit + ':' + name]):
                  raise ValueError('checkout differs from revision')
              hashes[name] = hashlib.sha256(data).hexdigest()
          target = pathlib.Path('build/NativeBitwardenStrictSDK10/hosted-checkpoint.json')
          with target.open('x') as out:
              json.dump({'schema': 1, 'files': hashes}, out, sort_keys=True, indent=2)
              out.write('\n')
          scopes = ('Package.swift', 'Sources', 'Tests', 'ThirdParty/BitwardenStrictEditSpike',
                    'ThirdParty/BitwardenAuthSpike', 'ThirdParty/BitwardenKeyClearSpike',
                    'ThirdParty/BitwardenSyncSpike', 'ThirdParty/BitwardenRefreshSpike',
                    'scripts/build-native-bitwarden-sdk.py', 'scripts/build-native-bitwarden-strict-sdk.py',
                    'scripts/prepare-native-bitwarden-hosted-inputs.py',
                    'scripts/prepare-native-bitwarden-hosted-source.py',
                    '.github/workflows/native-bitwarden-strict.yml')
          unexpected = subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard', '-z', '--', *scopes])
          if unexpected:
              raise ValueError('untracked source input')
          tracked = subprocess.check_output(['git', 'ls-files', '-z', '--', *scopes]).decode().split('\0')
          inventory = {}
          for name in filter(None, tracked):
              item = pathlib.Path(name)
              if item.is_symlink() or not item.is_file():
                  raise ValueError('unsafe source inventory entry')
              data = item.read_bytes()
              if data != subprocess.check_output(['git', 'show', commit + ':' + name]):
                  raise ValueError('source inventory differs from revision')
              inventory[name] = hashlib.sha256(data).hexdigest()
          with pathlib.Path('build/NativeBitwardenStrictSDK10/source-checkpoint.json').open('x') as out:
              json.dump({'revision': commit, 'files': inventory}, out, sort_keys=True, indent=2)
              out.write('\n')
          pathlib.Path('build/NativeBitwardenStrictSDK10/revision.txt').write_text(commit + '\n')
          PY
          echo "source_sha=$(shasum -a 256 build/NativeBitwardenStrictSDK10/source-checkpoint.json | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Acquire pinned public source and toolchain
        timeout-minutes: 45
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -eu
          /usr/bin/env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin HOME="$RUNNER_TEMP/strict-home" TMPDIR="$RUNNER_TEMP" DEVELOPER_DIR="$DEVELOPER_DIR" "$PYTHON" -B scripts/prepare-native-bitwarden-hosted-source.py --output "$GITHUB_WORKSPACE/build/NativeBitwardenStrictSDK10/source-inputs"
      - name: Acquire and validate locked Cargo inputs
        timeout-minutes: 60
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -eu
          source="$GITHUB_WORKSPACE/build/NativeBitwardenStrictSDK10/source-inputs"
          /usr/bin/env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin HOME="$RUNNER_TEMP/strict-home" TMPDIR="$RUNNER_TEMP" DEVELOPER_DIR="$DEVELOPER_DIR" "$PYTHON" -B scripts/prepare-native-bitwarden-hosted-inputs.py --profile sdk10 --source "$source/candidate" --pin "$GITHUB_WORKSPACE/ThirdParty/BitwardenStrictEditSpike/hosted-sdk10-inputs.pin.json" --output "$GITHUB_WORKSPACE/build/NativeBitwardenStrictSDK10/hosted-inputs" --rustup-home "$source/rustup" --cargo "$source/rustup/toolchains/1.98.0-aarch64-apple-darwin/bin/cargo"
      - name: Build release and debug SDK10 from verified inputs
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -eu
          work="$GITHUB_WORKSPACE/build/NativeBitwardenStrictSDK10"
          source="$work/source-inputs"
          checkpoint="$work/hosted-checkpoint.json"
          checkpoint_sha="$(shasum -a 256 "$checkpoint" | cut -d ' ' -f 1)"
          /usr/bin/env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin HOME="$RUNNER_TEMP/strict-home" TMPDIR="$RUNNER_TEMP" DEVELOPER_DIR="$DEVELOPER_DIR" /usr/bin/sandbox-exec -p '(version 1)(allow default)(deny network*)' "$PYTHON" -B scripts/build-native-bitwarden-strict-sdk.py --profile sdk10 --pin-sha256 a4c82a31ce2b83b06447c0195b425e85cb80ea5ce595731d8f7d6c907f806010 --output "$work/package-run" --legacy-builder "$GITHUB_WORKSPACE/scripts/build-native-bitwarden-sdk.py" --upstream "$source/upstream" --patch-root "$GITHUB_WORKSPACE" --write-candidate "$GITHUB_WORKSPACE/ThirdParty/BitwardenStrictEditSpike/strict-write.candidate.json" --source-review "$GITHUB_WORKSPACE/ThirdParty/BitwardenStrictEditSpike/sdk8-source-review.json" --consumer-source "$GITHUB_WORKSPACE/ThirdParty/BitwardenStrictEditSpike/strict-compile-consumer.swift.fixture" --service-patch "$GITHUB_WORKSPACE/ThirdParty/BitwardenStrictEditSpike/strict-service-shapes.patch" --service-candidate "$GITHUB_WORKSPACE/ThirdParty/BitwardenStrictEditSpike/strict-service-shapes.candidate.json" --service-source-review "$GITHUB_WORKSPACE/ThirdParty/BitwardenStrictEditSpike/sdk9-source-review.json" --service-primary "$source/primary" --normalization-patch "$GITHUB_WORKSPACE/ThirdParty/BitwardenStrictEditSpike/strict-empty-totp.patch" --normalization-candidate "$GITHUB_WORKSPACE/ThirdParty/BitwardenStrictEditSpike/strict-normalization.candidate.json" --hosted-inputs "$work/hosted-inputs" --hosted-preparer "$GITHUB_WORKSPACE/scripts/prepare-native-bitwarden-hosted-inputs.py" --hosted-checkpoint "$checkpoint" --hosted-checkpoint-sha256 "$checkpoint_sha" --hosted-rustup-home "$source/rustup" --hosted-cargo "$source/rustup/toolchains/1.98.0-aarch64-apple-darwin/bin/cargo"
      - name: Validate and stage package inventories
        id: package-verify
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -eu
          /usr/bin/env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin HOME="$RUNNER_TEMP/strict-home" TMPDIR="$RUNNER_TEMP" "$PYTHON" -B - <<'PY'
          import importlib.util, json, pathlib, shutil
          root = pathlib.Path.cwd()
          spec = importlib.util.spec_from_file_location('builder', root / 'scripts/build-native-bitwarden-strict-sdk.py')
          builder = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(builder)
          work = root / 'build/NativeBitwardenStrictSDK10'
          receipt = json.loads((work / 'package-run/receipt.json').read_bytes())
          if (receipt['profile'] != 'sdk10-empty-totp' or receipt['candidateGitTree'] != builder.NORMALIZATION_TREE
              or receipt['accepted'] is not False or receipt['integrationReady'] is not False):
              raise ValueError('package provenance')
          for mode in ('release', 'debug'):
              original = work / 'package-run' / ('Package-' + mode)
              target = work / ('Package-' + mode)
              expected = receipt['packages'][mode]
              if builder.file_inventory(original)[1:] != (expected['inventorySHA256'], expected['inventoryEntries']):
                  raise ValueError('package inventory')
              if builder.digest(original / 'build-manifest.json') != expected['manifestSHA256']:
                  raise ValueError('package manifest')
              shutil.copytree(original, target, symlinks=False)
              if builder.file_inventory(target)[1:] != (expected['inventorySHA256'], expected['inventoryEntries']):
                  raise ValueError('staged package inventory')
          PY
          echo "receipt_sha=$(shasum -a 256 build/NativeBitwardenStrictSDK10/package-run/receipt.json | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Compile actual Controller and run focused memory tests
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          git_clean() {
            /usr/bin/env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin HOME="$RUNNER_TEMP/strict-home" TMPDIR="$RUNNER_TEMP" GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 git "$@"
          }
          git_clean diff --no-ext-diff --no-textconv --exit-code
          git_clean diff --cached --no-ext-diff --no-textconv --exit-code
          test -z "$(git_clean ls-files --others --exclude-standard -- Sources Tests)"
          work="$GITHUB_WORKSPACE/build/NativeBitwardenStrictSDK10"
          debug_library="$work/Package-debug/Frameworks/BitwardenSDK.xcframework/macos-arm64"
          release_library="$work/Package-release/Frameworks/BitwardenSDK.xcframework/macos-arm64"
          mkdir -p "$work/swift-cache" "$work/swift-config" "$work/swift-security"
          common=(--jobs 2 --disable-keychain --disable-netrc --disable-dependency-cache --disable-prefetching --manifest-cache none --disable-sandbox --cache-path "$work/swift-cache" --config-path "$work/swift-config" --security-path "$work/swift-security")
          /usr/bin/env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin HOME="$RUNNER_TEMP/strict-home" TMPDIR="$RUNNER_TEMP" DEVELOPER_DIR="$DEVELOPER_DIR" ARCUSIS_NATIVE_BITWARDEN_NORMALIZATION_SDK=1 /usr/bin/sandbox-exec -p '(version 1)(allow default)(deny network*)' swift build "${common[@]}" --scratch-path "$work/swift-release" --target ArcusisBrowser -Xlinker -rpath -Xlinker "$release_library" 2>&1 | tee "$work/controller-release-build.log"
          /usr/bin/env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin HOME="$RUNNER_TEMP/strict-home" TMPDIR="$RUNNER_TEMP" DEVELOPER_DIR="$DEVELOPER_DIR" ARCUSIS_NATIVE_BITWARDEN_NORMALIZATION_SDK=1 ARCUSIS_NATIVE_BITWARDEN_STRICT_FIXTURE=1 /usr/bin/sandbox-exec -p '(version 1)(allow default)(deny network*)' swift build "${common[@]}" --scratch-path "$work/swift-debug" --target ArcusisBrowser -Xlinker -rpath -Xlinker "$debug_library" 2>&1 | tee "$work/controller-debug-build.log"
          /usr/bin/env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin HOME="$RUNNER_TEMP/strict-home" TMPDIR="$RUNNER_TEMP" DEVELOPER_DIR="$DEVELOPER_DIR" ARCUSIS_NATIVE_BITWARDEN_NORMALIZATION_SDK=1 ARCUSIS_NATIVE_BITWARDEN_STRICT_FIXTURE=1 /usr/bin/sandbox-exec -p '(version 1)(allow default)(deny network*)' swift test "${common[@]}" --scratch-path "$work/swift-debug" --filter NativeBitwardenStrictControllerTests -Xlinker -rpath -Xlinker "$debug_library" 2>&1 | tee "$work/controller-test.log"
          for test in controllerRevokesSynchronouslyAndSelectionDoesNotRevokeOtherProfile delayedFillCannotAdoptAfterLockDisableDisconnectOrServerChange disconnectAndServerChangeRevokeAcceptedAuthority delayedBackendAdoptionCannotReviveAfterLock reconnectRevokesOldAccountBeforeNewSnapshotAdoption; do
            grep -E "Test ${test}\\(\\) passed" build/NativeBitwardenStrictSDK10/controller-test.log
          done
      - name: Verify SDK10 selector conflicts
        run: |
          set -eu
          work="$GITHUB_WORKSPACE/build/NativeBitwardenStrictSDK10"
          mkdir -p "$work/selector-cache" "$work/selector-config" "$work/selector-security" "$work/selector-scratch"
          for conflict in sdk8 sdk9 legacy; do
            case "$conflict" in
              sdk8) key=ARCUSIS_NATIVE_BITWARDEN_STRICT_SDK; expected='Strict SDK10 cannot be combined with another strict SDK selection' ;;
              sdk9) key=ARCUSIS_NATIVE_BITWARDEN_SERVICE_SDK; expected='Strict SDK10 cannot be combined with another strict SDK selection' ;;
              legacy) key=ARCUSIS_NATIVE_BITWARDEN_SDK; expected='Strict SDK cannot be combined with legacy SDK selection' ;;
            esac
            if /usr/bin/env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin HOME="$RUNNER_TEMP/strict-home" TMPDIR="$RUNNER_TEMP" DEVELOPER_DIR="$DEVELOPER_DIR" ARCUSIS_NATIVE_BITWARDEN_NORMALIZATION_SDK=1 "$key=1" /usr/bin/sandbox-exec -p '(version 1)(allow default)(deny network*)' swift package --package-path "$GITHUB_WORKSPACE" --cache-path "$work/selector-cache" --config-path "$work/selector-config" --security-path "$work/selector-security" --scratch-path "$work/selector-scratch" --disable-dependency-cache --disable-build-manifest-caching --manifest-cache none --disable-netrc --disable-keychain --disable-prefetching --disable-sandbox -j 2 dump-package >"$work/selector-$conflict.json" 2>"$work/selector-$conflict.log"; then
              echo "Unexpected selector success: $conflict" >&2
              exit 1
            fi
            grep -F "$expected" "$work/selector-$conflict.log"
          done
      - name: Revalidate source and package inventories
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
          SOURCE_CHECKPOINT_SHA: ${{ steps.input-checkpoint.outputs.source_sha }}
          PACKAGE_RECEIPT_SHA: ${{ steps.package-verify.outputs.receipt_sha }}
        run: |
          set -eu
          /usr/bin/env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin HOME="$RUNNER_TEMP/strict-home" TMPDIR="$RUNNER_TEMP" GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 SOURCE_CHECKPOINT_SHA="$SOURCE_CHECKPOINT_SHA" PACKAGE_RECEIPT_SHA="$PACKAGE_RECEIPT_SHA" "$PYTHON" -B - <<'PY'
          import hashlib, importlib.util, json, os, pathlib, subprocess
          root = pathlib.Path.cwd()
          work = root / 'build/NativeBitwardenStrictSDK10'
          digest = lambda path: hashlib.sha256(path.read_bytes()).hexdigest()
          checkpoint = work / 'source-checkpoint.json'
          package_receipt = work / 'package-run/receipt.json'
          if digest(checkpoint) != os.environ['SOURCE_CHECKPOINT_SHA']:
              raise ValueError('source checkpoint changed')
          if digest(package_receipt) != os.environ['PACKAGE_RECEIPT_SHA']:
              raise ValueError('package receipt changed')
          saved = json.loads(checkpoint.read_bytes())
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if saved['revision'] != commit:
              raise ValueError('revision changed')
          scopes = ('Package.swift', 'Sources', 'Tests', 'ThirdParty/BitwardenStrictEditSpike',
                    'ThirdParty/BitwardenAuthSpike', 'ThirdParty/BitwardenKeyClearSpike',
                    'ThirdParty/BitwardenSyncSpike', 'ThirdParty/BitwardenRefreshSpike',
                    'scripts/build-native-bitwarden-sdk.py', 'scripts/build-native-bitwarden-strict-sdk.py',
                    'scripts/prepare-native-bitwarden-hosted-inputs.py',
                    'scripts/prepare-native-bitwarden-hosted-source.py',
                    '.github/workflows/native-bitwarden-strict.yml')
          if subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard', '-z', '--', *scopes]):
              raise ValueError('new source input')
          tracked = set(filter(None, subprocess.check_output(['git', 'ls-files', '-z', '--', *scopes]).decode().split('\0')))
          if tracked != set(saved['files']):
              raise ValueError('source inventory changed')
          for name, expected in saved['files'].items():
              path = root / name
              if path.is_symlink() or not path.is_file() or digest(path) != expected:
                  raise ValueError('source content changed')
          spec = importlib.util.spec_from_file_location('builder', root / 'scripts/build-native-bitwarden-strict-sdk.py')
          builder = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(builder)
          receipt = json.loads(package_receipt.read_bytes())
          for mode in ('release', 'debug'):
              expected = receipt['packages'][mode]
              for package in (work / ('Package-' + mode), work / 'package-run' / ('Package-' + mode)):
                  if builder.file_inventory(package)[1:] != (expected['inventorySHA256'], expected['inventoryEntries']):
                      raise ValueError('package inventory changed')
                  if builder.digest(package / 'build-manifest.json') != expected['manifestSHA256']:
                      raise ValueError('package manifest changed')
          proof = {'status': 'passed', 'revision': commit,
                   'sourceCheckpointSHA256': os.environ['SOURCE_CHECKPOINT_SHA'],
                   'packageReceiptSHA256': os.environ['PACKAGE_RECEIPT_SHA'],
                   'controllerTestLogSHA256': digest(work / 'controller-test.log'),
                   'selectorLogSHA256': {name: digest(work / ('selector-' + name + '.log'))
                                         for name in ('sdk8', 'sdk9', 'legacy')}}
          with (work / 'controller-proof.json').open('x') as output:
              json.dump(proof, output, sort_keys=True, indent=2)
              output.write('\n')
          PY
      - name: Preserve source and package receipts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: strict-controller-sdk10-source-receipts
          path: |
            build/NativeBitwardenStrictSDK10/revision.txt
            build/NativeBitwardenStrictSDK10/hosted-checkpoint.json
            build/NativeBitwardenStrictSDK10/source-checkpoint.json
            build/NativeBitwardenStrictSDK10/source-inputs/source-receipt.json
            build/NativeBitwardenStrictSDK10/hosted-inputs/receipt.json
            build/NativeBitwardenStrictSDK10/package-run/receipt.json
            build/NativeBitwardenStrictSDK10/controller-release-build.log
            build/NativeBitwardenStrictSDK10/controller-debug-build.log
            build/NativeBitwardenStrictSDK10/controller-test.log
            build/NativeBitwardenStrictSDK10/selector-*.log
            build/NativeBitwardenStrictSDK10/controller-proof.json
          if-no-files-found: warn
          retention-days: 14
