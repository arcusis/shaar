name: Native password startup component

on:
  pull_request:
    branches:
      - production
      - 'feat/native-*'
  push:
    branches:
      - production
      - 'feat/native-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  startup-component:
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      ARCUSIS_NATIVE_PASSWORD_STARTUP_CI: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Compile and run named component fixtures
        run: bash scripts/test-native-password-startup.sh
      - name: Upload component evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: native-password-startup-component
          path: build/Verification/native-password-startup/evidence/
          if-no-files-found: warn
