name: Release

# Verifies a published Shaar release against its tagged source.
#
# arcusis/shaar is internal, so the update feed and downloads live in the public repository
# named by SHAAR_RELEASE_REPOSITORY in scripts/release-config.sh. Releases there cannot
# trigger this workflow, so run it by hand after publishing the GitHub Release and pushing
# docs/appcast.xml to that repository. scripts/release.sh runs the same appcast and ZIP checks
# locally before upload. See Notebook/Releasing.md.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (for example v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-release:
    name: Validate release tag, assets and appcast
    runs-on: [self-hosted, macOS, arcusis-macos]
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.tag }}

    steps:
      - name: Check tag format
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Release tag must be v followed by Major.Minor.Patch: $RELEASE_TAG"
            exit 1
          }

      - name: Check out tagged source
        # actions/checkout v5.1.0
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Load tagged release contract
        run: |
          set -euo pipefail
          names=$(python3 scripts/release_feed.py describe)
          read -r tag dmg zip <<< "$names"
          if [ "$tag" != "$RELEASE_TAG" ]; then
            echo "::error::Tagged release-config.sh describes $tag, not $RELEASE_TAG"
            exit 1
          fi
          python3 scripts/release_feed.py check-key
          source scripts/release-config.sh
          {
            echo "EXPECTED_DMG=$dmg"
            echo "EXPECTED_ZIP=$zip"
            echo "RELEASE_REPOSITORY=$SHAAR_RELEASE_REPOSITORY"
            echo "FEED_URL=$SHAAR_FEED_URL"
          } >> "$GITHUB_ENV"

      - name: Require exact release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          assets=$(gh api "repos/$RELEASE_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.assets[].name')
          missing=0
          for asset in "$EXPECTED_DMG" "$EXPECTED_ZIP"; do
            if printf '%s\n' "$assets" | grep -Fxq "$asset"; then
              echo "Found required asset: $asset"
            else
              echo "::error::Release $RELEASE_TAG in $RELEASE_REPOSITORY is missing exact asset $asset"
              missing=1
            fi
          done
          exit "$missing"

      - name: Validate live appcast and public update download
        run: |
          set -euo pipefail
          # Fetch both without credentials, exactly as Sparkle clients do.
          curl --fail --silent --show-error --location "$FEED_URL" --output "$RUNNER_TEMP/appcast.xml"
          curl --fail --silent --show-error --location \
            "https://github.com/$RELEASE_REPOSITORY/releases/download/$RELEASE_TAG/$EXPECTED_ZIP" \
            --output "$RUNNER_TEMP/$EXPECTED_ZIP"
          python3 scripts/release_feed.py validate \
            --appcast "$RUNNER_TEMP/appcast.xml" --zip "$RUNNER_TEMP/$EXPECTED_ZIP"
