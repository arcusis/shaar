name: OpenSSF Scorecard
on:
  push:
    branches: [production]
  schedule:
    - cron: '41 3 * * 1'
permissions:
  contents: read
concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: false
jobs:
  analysis:
    name: Supply-chain assessment
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: scorecard-${{ github.run_id }}
          path: scorecard.sarif
          retention-days: 14
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          sarif_file: scorecard.sarif
