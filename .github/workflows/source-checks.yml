name: Source checks

on:
  pull_request:
    branches:
      - production
      - 'feat/native-*'
  push:
    branches:
      - production
      - 'feat/native-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-checks:
    name: Swift and Python source checks
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

    steps:
      - name: Check out source
        # actions/checkout v5.1.0
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Set up Python
        # actions/setup-python v6.3.0
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'

      - name: Report toolchain
        run: |
          xcodebuild -version
          swift --version
          python --version

      - name: Run Swift build and tests
        run: swift test --jobs 2

      - name: Capture native Bitwarden settings visuals
        env:
          ARCUSIS_NATIVE_SETTINGS_VISUAL_CI: '1'
        run: swift test --jobs 2 --filter NativeBitwardenSettingsVisualTests

      - name: Upload native Bitwarden settings visual evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: native-settings-visual-ci
          path: build/Verification/native-settings-visual-ci/
          if-no-files-found: warn

      - name: Check Swift formatting
        run: swift format lint --strict --recursive Package.swift Sources Tests

      - name: Install Python test dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes --only-binary=:all: -r ThirdParty/VaultwardenFixture/requirements.txt

      - name: Run Python tests
        run: .venv/bin/python scripts/test-python.py
