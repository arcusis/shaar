name: Source checks

on:
  pull_request:
    branches: [production, 'feat/native-*']
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [production, 'feat/native-*']
  merge_group:
    types: [checks_requested]
    branches: [production]
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:
    inputs:
      deep_checks:
        description: Include sanitizer and dead-code checks (disable only for PR-graph timing)
        type: boolean
        default: true
      probe_iterations:
        description: Repetitions per mode (1-10; private/Quit minimum 3; no retries)
        type: number
        default: 1

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# GitHub expressions cannot split a synthetic merge-group ref. The plan job
# validates and extracts its PR number so resource jobs can replace only their
# matching stage when the queue rebuilds.

jobs:
  plan:
    name: Select CI stages
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full: ${{ steps.plan.outputs.full }}
      website: ${{ steps.plan.outputs.website }}
      swift: ${{ steps.plan.outputs.swift }}
      shipping_guard: ${{ steps.plan.outputs.shipping_guard }}
      abi_contract: ${{ steps.plan.outputs.abi_contract }}
      base: ${{ steps.plan.outputs.base }}
      iterations: ${{ steps.plan.outputs.iterations }}
      queue_pr: ${{ steps.plan.outputs.queue_pr }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify immutable source and website diffs
        id: plan
        run: python3 scripts/ci-plan.py

  inspector-contracts:
    name: Headless Inspector renderer contracts
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        # actions/checkout v5.1.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node
        # actions/setup-node v5.0.0
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.24.0 --activate
      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Tests/InspectorContractTests/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ runner.arch }}-
      - name: Cache Playwright Chromium shell
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: build/PlaywrightBrowsers
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Tests/InspectorContractTests/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-${{ runner.arch }}-
      - name: Install pinned test dependencies
        run: |
          python3 -m venv .venv
          pnpm --dir Tests/InspectorContractTests install --frozen-lockfile --ignore-scripts
          pnpm --dir Tests/InspectorContractTests exec playwright install chromium --with-deps --only-shell
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/build/PlaywrightBrowsers

      - name: Run renderer contracts
        run: pnpm --dir Tests/InspectorContractTests test

      - name: Upload source-hashed renderer evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: inspector-renderer-contracts
          path: build/Verification/inspector-contracts.json
          if-no-files-found: error

  website:
    name: Website contracts
    needs: plan
    if: needs.plan.outputs.website == 'true'
    uses: ./.github/workflows/website-checks.yml

  fast:
    name: Fast gates
    needs: plan
    runs-on: ${{ needs.plan.outputs.abi_contract == 'true' && 'macos-26' || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
        with:
          mode: fast
          tools: 'true'
      - name: Check bridge ABI against the cached pinned engine archive
        if: needs.plan.outputs.abi_contract == 'true'
        run: .venv/bin/python scripts/ci-stage.py abi-contract
      - name: Platform-independent format, lint, license, Notebook, pins and secret checks
        if: needs.plan.outputs.full == 'true'
        env:
          CI_BASE_SHA: ${{ needs.plan.outputs.base }}
        run: .venv/bin/python scripts/ci-checks.py --skip-python
      - name: Check docs-only content and links
        if: needs.plan.outputs.full != 'true'
        env:
          CI_BASE_SHA: ${{ needs.plan.outputs.base }}
        run: .venv/bin/python scripts/ci-checks.py --docs-only
      - name: Upload Hebrew string inventory for translators
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: needs.plan.outputs.full == 'true'
        with:
          name: hebrew-string-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/Localization/Hebrew_String_Inventory.csv
          if-no-files-found: error
          retention-days: 30
      - uses: ./.github/actions/ci-evidence
        if: always()
        with:
          stage: fast

  python-tests:
    name: Python and Apple resource tests
    needs: plan
    concurrency:
      group: source-checks-${{ github.event_name }}-${{ needs.plan.outputs.queue_pr || github.ref }}-python-tests
      cancel-in-progress: ${{ github.event_name == 'merge_group' }}
    if: needs.plan.outputs.full == 'true'
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
        with:
          mode: fast
          tools: 'true'
      - name: Run the complete Python test suite with JUnit
        run: .venv/bin/python scripts/test-python.py --junit build/ci/python/python.xml
      - uses: ./.github/actions/ci-evidence
        if: always()
        with:
          stage: python

  dependency-review:
    name: Dependency review
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
        with:
          base-ref: ${{ needs.plan.outputs.base }}
          head-ref: ${{ github.sha }}
          fail-on-severity: high
      - name: Report review scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: echo "Dependency review event $EVENT_NAME; diff checks run for PR, merge-group and manual validation events." >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build and unit tests
    needs: plan
    concurrency:
      group: source-checks-${{ github.event_name }}-${{ needs.plan.outputs.queue_pr || github.ref }}-build
      cancel-in-progress: ${{ github.event_name == 'merge_group' }}
    if: needs.plan.outputs.full == 'true'
    uses: ./.github/workflows/ci-build.yml
    with:
      base_sha: ${{ needs.plan.outputs.base }}

  basic-browsing:
    name: Normal window browsing smoke
    needs: [plan, engine-bundle]
    if: needs.plan.outputs.full == 'true' && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    concurrency:
      group: source-checks-${{ github.event_name }}-${{ needs.plan.outputs.queue_pr || github.ref }}-basic-browsing
      cancel-in-progress: ${{ github.event_name == 'merge_group' }}
    runs-on: macos-26
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
        with:
          mode: verification
          products: build/swiftpm/verification
      - name: Download shared exact-source verification bundle
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ci-engine-build-${{ github.run_id }}
          path: build/ci/engine-build
      - name: Identify exact source tree for bundle validation
        run: |
          echo "CI_BUNDLE_INPUTS=${{ hashFiles('Package.swift', 'Package.resolved', 'Sources/**', 'Tests/**', 'Resources/**', 'Plugins/**', 'ThirdParty/ChromiumEngine/**', 'ThirdParty/FrameworkDevTools/**', 'scripts/fetch-framework-devtools.py', 'scripts/bundle-app.sh', 'scripts/ci-stage.py', 'scripts/release-config.sh', 'scripts/engine-signing.sh', 'scripts/fetch-engine.sh', 'scripts/rebrand-engine-framework.py', 'scripts/engine_payload.py', 'scripts/verify_engine_bundle.py', 'scripts/stage-browser-resources.py', 'scripts/release_feed.py') }}" >> "$GITHUB_ENV"
          echo "CI_SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_ENV"
      - name: Restore verified bundle and run normal browsing smoke
        run: .venv/bin/python scripts/ci-stage.py basic-browsing
      - uses: ./.github/actions/ci-evidence
        if: always()
        with:
          stage: basic-browsing

  coverage:
    name: Coverage no regression
    needs: [plan, build]
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Confirm coverage ran with the unit build
        env:
          COVERAGE_RESULT: ${{ needs.build.outputs.coverage }}
        run: test "$COVERAGE_RESULT" = passed

  visuals:
    name: Hosted sidebar component visuals (shard ${{ matrix.shard }})
    needs: plan
    concurrency:
      group: source-checks-${{ github.event_name }}-${{ needs.plan.outputs.queue_pr || github.ref }}-visuals-${{ matrix.shard }}
      cancel-in-progress: ${{ github.event_name == 'merge_group' }}
    if: needs.plan.outputs.full == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: ['1', '2']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
        with:
          mode: visual
      - name: Run assigned hosted visual filters
        env:
          VISUAL_SHARD: ${{ matrix.shard }}
        run: .venv/bin/python scripts/ci-stage.py visual --visual-shard "$VISUAL_SHARD"
      - uses: ./.github/actions/ci-evidence
        if: always()
        with:
          stage: visual-${{ matrix.shard }}
          extra-path: ${{ matrix.shard == '1' && 'build/Verification/sidebar-chrome-ci' || '' }}

  localization-captures:
    name: English and Hebrew offscreen localization captures
    needs: plan
    concurrency:
      group: source-checks-${{ github.event_name }}-${{ needs.plan.outputs.queue_pr || github.ref }}-localization-captures
      cancel-in-progress: ${{ github.event_name == 'merge_group' }}
    if: needs.plan.outputs.full == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
        with:
          mode: localization
      - name: Build and capture English and Hebrew offscreen screens
        run: .venv/bin/python scripts/ci-stage.py localization-captures
      - uses: ./.github/actions/ci-evidence
        if: always()
        with:
          stage: localization-captures
          extra-path: build/Verification/localization-visuals

  localization:
    name: Native engine locale and restart probe
    needs: [plan, engine-bundle]
    concurrency:
      group: source-checks-${{ github.event_name }}-${{ needs.plan.outputs.queue_pr || github.ref }}-localization
      cancel-in-progress: ${{ github.event_name == 'merge_group' }}
    if: needs.plan.outputs.full == 'true'
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
        with:
          mode: engine-probe
      - name: Download shared exact-source verification bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ci-engine-build-${{ github.run_id }}
          path: build/ci/engine-build
      - name: Identify exact source tree for bundle validation
        run: |
          echo "CI_BUNDLE_INPUTS=${{ hashFiles('Package.swift', 'Package.resolved', 'Sources/**', 'Tests/**', 'Resources/**', 'Plugins/**', 'ThirdParty/ChromiumEngine/**', 'ThirdParty/FrameworkDevTools/**', 'scripts/fetch-framework-devtools.py', 'scripts/bundle-app.sh', 'scripts/ci-stage.py', 'scripts/release-config.sh', 'scripts/engine-signing.sh', 'scripts/fetch-engine.sh', 'scripts/rebrand-engine-framework.py', 'scripts/engine_payload.py', 'scripts/verify_engine_bundle.py', 'scripts/stage-browser-resources.py', 'scripts/release_feed.py') }}" >> "$GITHUB_ENV"
          echo "CI_SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_ENV"
      - name: Verify native engine language and restart
        env:
          SHAAR_LOCALIZATION_BACKTRACE: '1'
        run: .venv/bin/python scripts/ci-stage.py localization
      - uses: ./.github/actions/ci-evidence
        if: always()
        with:
          stage: localization
          extra-path: build/Verification/localization-engine-evidence

  engine-bundle:
    name: Shared verification bundle
    needs: plan
    concurrency:
      group: source-checks-${{ github.event_name }}-${{ needs.plan.outputs.queue_pr || github.ref }}-engine-bundle
      cancel-in-progress: ${{ github.event_name == 'merge_group' }}
    if: needs.plan.outputs.full == 'true'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/ci-engine-bundle.yml
    with:
      iterations: ${{ fromJSON(needs.plan.outputs.iterations || '1') }}

  engine:
    name: Engine simulations
    needs: [plan, engine-bundle]
    concurrency:
      group: source-checks-${{ github.event_name }}-${{ needs.plan.outputs.queue_pr || github.ref }}-engine
      cancel-in-progress: ${{ github.event_name == 'merge_group' }}
    if: needs.plan.outputs.full == 'true'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/ci-engine.yml
    with:
      iterations: ${{ fromJSON(needs.plan.outputs.iterations || '1') }}
      shards: ${{ needs.engine-bundle.outputs.shards }}

  shaar-engine-simulation:
    name: Shaar engine simulation (first tab)
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
        with:
          mode: shaar-engine-verification
          products: build/swiftpm/verification
      - name: Cache SHA-256 pinned Shaar test framework archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: build/ShaarEngineTestCache/*.tar.xz
          key: shaar-test-engine-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ThirdParty/ChromiumEngine/ci-test-pin.json') }}
      - name: Fetch SHA-256 pinned Shaar test framework
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-shaar-test-engine.sh
      - name: Build the headless Shaar verification bundle
        env:
          SHAAR_TEST_SHAAR_ENGINE: '1'
        run: bash scripts/bundle-app.sh --configuration release --with-engine --verification
      - name: Open the first tab through the Shaar backend
        id: first_tab
        run: |
          app="$PWD/build/Shaar Verification.app"
          evidence="$PWD/build/ci/shaar-engine-simulation"
          mkdir -p "$evidence"
          date +%s > "$RUNNER_TEMP/shaar-engine-first-tab-start"
          "$app/Contents/MacOS/ShaarVerification" \
            --probe-shaar-first-tab \
            --probe-framework "$app/Contents/Frameworks/Chromium Framework.framework" \
            --probe-output "$evidence/first-tab.json" \
            --probe-data-dir "$RUNNER_TEMP/shaar-engine-first-tab" \
            > "$evidence/first-tab.stdout.log" \
            2> "$evidence/first-tab.stderr.log"
          jq -e '.passed == true and .backend == "shaar" and .nativeView == true and
            .navigationObserved == true and .allWindowsHidden == true' \
            "$evidence/first-tab.json" >/dev/null
      - name: Collect first-tab crash reports and stderr
        if: failure() && steps.first_tab.outcome == 'failure'
        run: |
          evidence="$PWD/build/ci/shaar-engine-simulation"
          reports="$evidence/first-tab-crash-reports"
          mkdir -p "$reports"
          cp "$evidence/first-tab.stderr.log" "$reports/" 2>/dev/null || true
          cp "$evidence/first-tab.stdout.log" "$reports/" 2>/dev/null || true
          {
            sw_vers || true
            xcodebuild -version || true
            swift --version || true
            echo '--- ci-test-pin.json ---' || true
            cat ThirdParty/ChromiumEngine/ci-test-pin.json || true
            echo '--- production pin.json ---' || true
            cat ThirdParty/ChromiumEngine/pin.json || true
            echo '--- cached test engine archive digests ---' || true
            if [ -d build/ShaarEngineTestCache ]; then
              find build/ShaarEngineTestCache -type f -name '*.tar.xz' \
                -exec shasum -a 256 {} \; || true
            fi
            echo '--- cached production engine archive digests ---' || true
            if [ -d build/EngineCache ]; then
              find build/EngineCache -type f -name '*.tar.xz' \
                -exec shasum -a 256 {} \; || true
            else
              echo 'No production pinned archive is fetched by this first-tab job.' || true
            fi
          } > "$reports/runner-environment.txt" 2>&1
          report_dir="$HOME/Library/Logs/DiagnosticReports"
          attempts=15
          while [ "$attempts" -gt 0 ]; do
            if [ -d "$report_dir" ]; then
              find "$report_dir" -type f -name '*.ips' \
                -newer "$RUNNER_TEMP/shaar-engine-first-tab-start" \
                \( -iname 'Shaar*.ips' -o -iname 'Chromium*.ips' \) \
                -print > "$reports/crash-report-paths.txt"
              if [ -s "$reports/crash-report-paths.txt" ]; then
                while IFS= read -r report; do cp "$report" "$reports/"; done \
                  < "$reports/crash-report-paths.txt"
                break
              fi
            fi
            attempts=$((attempts - 1))
            sleep 1
          done
      - name: Upload first-tab crash diagnostics
        if: failure() && steps.first_tab.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ci-shaar-first-tab-crash-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci/shaar-engine-simulation/first-tab-crash-reports/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
      - name: Verify Shaar private policy readback in an OTR session
        run: |
          app="$PWD/build/Shaar Verification.app"
          evidence="$PWD/build/ci/shaar-engine-simulation"
          "$app/Contents/MacOS/ShaarVerification" \
            --probe-shaar-first-tab \
            --probe-shaar-private-privacy \
            --probe-framework "$app/Contents/Frameworks/Chromium Framework.framework" \
            --probe-output "$evidence/private-privacy.json" \
            --probe-data-dir "$RUNNER_TEMP/shaar-engine-private-privacy" \
            > "$evidence/private-privacy.log" 2>&1
          jq -e '.passed == true and .backend == "shaar" and .allWindowsHidden == true and
            (.privatePolicyChecks | length == 7 and all(.[]; . == true))' \
            "$evidence/private-privacy.json" >/dev/null
      - uses: ./.github/actions/ci-evidence
        if: always()
        with:
          stage: shaar-engine-simulation

  shipping-probe-guard:
    name: Shipping executable excludes verification probes
    needs: plan
    if: github.event_name == 'pull_request' && needs.plan.outputs.shipping_guard == 'true'
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
        with:
          mode: shipping
          products: build/swiftpm/default
      - name: Build shipping bundle and run assert_no_verification_code
        env:
          SHAAR_BUNDLE_SWIFT_JOBS: '4'
        run: bash scripts/bundle-app.sh --with-engine

  shipping:
    name: Shipping bundle
    needs: [plan, fast, python-tests, dependency-review]
    concurrency:
      group: source-checks-${{ github.event_name }}-${{ needs.plan.outputs.queue_pr || github.ref }}-shipping
      cancel-in-progress: ${{ github.event_name == 'merge_group' }}
    if: needs.plan.outputs.full == 'true'
    permissions:
      contents: read
      attestations: write
      id-token: write
    uses: ./.github/workflows/ci-shipping.yml

  codeql:
    name: CodeQL
    needs: plan
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/ci-codeql.yml
    with:
      swift: false

  sanitizers:
    name: Nightly ${{ matrix.sanitizer }} sanitizer
    needs: [plan, fast, build]
    concurrency:
      group: source-checks-${{ github.event_name }}-${{ needs.plan.outputs.queue_pr || github.ref }}-sanitizers-${{ matrix.sanitizer }}
      cancel-in-progress: ${{ github.event_name == 'merge_group' }}
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.deep_checks)
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
        with:
          mode: sanitizer-${{ matrix.sanitizer }}
          products: build/swiftpm/${{ matrix.sanitizer }}
      - name: Run tests with sanitizer findings fatal
        env:
          CI_SANITIZER: ${{ matrix.sanitizer }}
        run: .venv/bin/python scripts/ci-stage.py sanitize --sanitizer "$CI_SANITIZER"
      - uses: ./.github/actions/ci-evidence
        if: always()
        with:
          stage: sanitize-${{ matrix.sanitizer }}

  dead-code:
    name: Nightly dead-code report
    needs: [plan, fast, build]
    concurrency:
      group: source-checks-${{ github.event_name }}-${{ needs.plan.outputs.queue_pr || github.ref }}-dead-code
      cancel-in-progress: ${{ github.event_name == 'merge_group' }}
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.deep_checks)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
        with:
          mode: dead-code
      - name: Install pinned dead-code scanner
        run: |
          .venv/bin/python scripts/install-ci-tools.py --include-periphery
          echo "$PWD/build/ci-tools" >> "$GITHUB_PATH"
      - name: Analyze unused declarations with runtime entry points retained
        run: .venv/bin/python scripts/ci-stage.py dead-code
      - uses: ./.github/actions/ci-evidence
        if: always()
        with:
          stage: dead-code

  required:
    name: CI required
    if: always()
    needs: [plan, fast, python-tests, dependency-review, build, coverage, visuals, localization, localization-captures, engine, basic-browsing, shaar-engine-simulation, shipping, shipping-probe-guard, codeql, inspector-contracts, website, sanitizers, dead-code]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require every selected stage to pass
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_FULL: ${{ needs.plan.outputs.full }}
          CI_WEBSITE: ${{ needs.plan.outputs.website }}
          CI_BROWSING: ${{ needs.plan.outputs.full == 'true' && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
          CI_SHIPPING_GUARD: ${{ needs.plan.outputs.shipping_guard == 'true' && github.event_name == 'pull_request' }}
          CI_NIGHTLY: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.deep_checks) }}
          CI_ADVISORY_STAGES: ${{ vars.CI_ADVISORY_STAGES }}
        run: python3 scripts/ci-gate.py
