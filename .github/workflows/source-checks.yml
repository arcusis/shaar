name: Source checks

on:
  pull_request:
    branches: [production, 'feat/native-*']
  push:
    branches: [production, 'feat/native-*']
  merge_group:
    types: [checks_requested]
    branches: [production]
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:
    inputs:
      probe_iterations:
        description: Repetitions per mode (1-10; private/Quit minimum 3; no retries)
        type: number
        default: 1

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Select CI stages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.plan.outputs.full }}
      base: ${{ steps.plan.outputs.base }}
      iterations: ${{ steps.plan.outputs.iterations }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify only proven documentation-only diffs
        id: plan
        run: python3 scripts/ci-plan.py

  fast:
    name: Fast gates
    needs: plan
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
        with:
          mode: fast
          tools: 'true'
      - name: Format, lint, licenses, Notebook, pins, secrets and Python tests
        run: .venv/bin/python scripts/ci-checks.py
      - uses: ./.github/actions/ci-evidence
        if: always()
        with:
          stage: fast

  dependency-review:
    name: Dependency review
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
        with:
          base-ref: ${{ needs.plan.outputs.base }}
          head-ref: ${{ github.sha }}
          fail-on-severity: high
      - name: Report review scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: echo "Dependency review event $EVENT_NAME; diff checks run for PR, merge-group and manual validation events." >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build and unit tests
    needs: [plan, fast, dependency-review]
    if: needs.plan.outputs.full == 'true'
    uses: ./.github/workflows/ci-build.yml

  coverage:
    name: Coverage no regression
    needs: [plan, build]
    if: needs.plan.outputs.full == 'true'
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
        with:
          mode: coverage-base
          products: build/swiftpm/coverage-base
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: ci-unit-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci/unit
      - name: Build immutable base and compare module line coverage
        env:
          CI_BASE_SHA: ${{ needs.plan.outputs.base }}
        run: .venv/bin/python scripts/ci-stage.py coverage
      - uses: ./.github/actions/ci-evidence
        if: always()
        with:
          stage: coverage
          extra-path: build/ci/coverage-base

  visuals:
    name: Hosted sidebar component visuals
    needs: [plan, build]
    if: needs.plan.outputs.full == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
        with:
          mode: visual
      - name: Run all existing hosted visual filters
        run: .venv/bin/python scripts/ci-stage.py visual
      - uses: ./.github/actions/ci-evidence
        if: always()
        with:
          stage: visual
          extra-path: build/Verification/sidebar-chrome-ci

  engine:
    name: Engine simulations
    needs: [plan, build]
    if: needs.plan.outputs.full == 'true'
    uses: ./.github/workflows/ci-engine.yml
    with:
      iterations: ${{ fromJSON(needs.plan.outputs.iterations || '1') }}

  shipping:
    name: Shipping bundle
    needs: [plan, engine, coverage, visuals]
    if: needs.plan.outputs.full == 'true'
    permissions:
      contents: read
      attestations: write
      id-token: write
    uses: ./.github/workflows/ci-shipping.yml

  codeql:
    name: CodeQL
    needs: [plan, fast]
    if: needs.plan.outputs.full == 'true'
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/ci-codeql.yml

  sanitizers:
    name: Nightly ${{ matrix.sanitizer }} sanitizer
    needs: [fast, build]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
        with:
          mode: sanitizer-${{ matrix.sanitizer }}
          products: build/swiftpm/${{ matrix.sanitizer }}
      - name: Run tests with sanitizer findings fatal
        env:
          CI_SANITIZER: ${{ matrix.sanitizer }}
        run: .venv/bin/python scripts/ci-stage.py sanitize --sanitizer "$CI_SANITIZER"
      - uses: ./.github/actions/ci-evidence
        if: always()
        with:
          stage: sanitize-${{ matrix.sanitizer }}

  dead-code:
    name: Nightly dead-code report
    needs: [fast, build]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
        with:
          mode: dead-code
      - name: Install pinned dead-code scanner
        run: |
          .venv/bin/python scripts/install-ci-tools.py --include-periphery
          echo "$PWD/build/ci-tools" >> "$GITHUB_PATH"
      - name: Analyze unused declarations with runtime entry points retained
        run: .venv/bin/python scripts/ci-stage.py dead-code
      - uses: ./.github/actions/ci-evidence
        if: always()
        with:
          stage: dead-code

  required:
    name: CI required
    if: always()
    needs: [plan, fast, dependency-review, build, coverage, visuals, engine, shipping, codeql, sanitizers, dead-code]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require every selected stage to pass
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_FULL: ${{ needs.plan.outputs.full }}
          CI_NIGHTLY: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: python3 scripts/ci-gate.py
