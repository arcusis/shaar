name: Swift security
on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift-security-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    name: CodeQL Swift
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/ci-codeql.yml
    with:
      swift_only: true
      full: true

  required:
    name: Swift security required
    needs: analyze
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require Swift success and no open code-scanning alerts
        env:
          SWIFT_RESULT: ${{ needs.analyze.result }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$SWIFT_RESULT" = success
          python3 scripts/check-release-ci.py --repository "$GITHUB_REPOSITORY" --alerts-only

  issues:
    name: Sync code-scanning issues
    needs: analyze
    if: always() && needs.analyze.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      security-events: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Open an issue per open alert and close fixed ones
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/sync-code-scanning-issues.py --repository "$GITHUB_REPOSITORY"
