name: Deploy website

on:
  push:
    branches: [production]
    paths:
      - 'website/**'
      - '.github/workflows/website-deploy.yml'
      - 'Branding/**'
      - '.github/assets/**'
      - 'LICENSE'
      - 'NOTICE'
      - 'THIRD_PARTY_NOTICES.md'

permissions:
  contents: read

concurrency:
  group: website-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.1.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Enable pinned pnpm with Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check website
        run: pnpm check
      - name: Deploy Worker and static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice title=Website deploy skipped::No CLOUDFLARE_API_TOKEN secret is set. Deploy with pnpm wrangler deploy from a logged-in machine."
            exit 0
          fi
          pnpm wrangler deploy
