title = "Shaar secret checks"

[extend]
useDefault = true

# Generated products and dependencies at repository root are not source.
# No complete source file, authored fixture or credential-shaped file is exempted.
[[allowlists]]
description = "Generated build and dependency directories"
paths = ['''^(\.git|\.build|\.venv|build)/''']

[[allowlists]]
description = "Known public extension identity key"
condition = "AND"
paths = ['''^Tests/Fixtures/ProfileExtension/manifest\.json$''']
regexTarget = "match"
regexes = ['''^key":\ "MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAvnIuafbHv5\+GLNAtTskR8y8ugcm3gZZWKRXl3c3RGrMbw0OmLfSfonfbfmRgkcxoa2RAUjoNwiAkx7SWLEaHvbCRBh9WU4EJauQ5ccD7usein22Ynl\+h2H1NZi9j7aOmm/h4KZ71Kr\+65ynsFEyDK0Ru5AwwKokKYTgUJsFNuMzZZnO3cXRtb9RLcv9MyDduYic7whvdoD/yYEvf6bks0hCZIAcS5Aa3A7HisUl34gL7wcV2RtUrFQ/G\+hkxHOnlj/qHwk/AzUjh7\+DJSGCmyKx6M6Ie6of9d9iRxcQpyW0Y0z/DgnSnq3KE0uhWlbhe5kfnkcYIzQUGI\+OB48utHQIDAQAB"$''']

[[allowlists]]
description = "Known public Sparkle verification key"
condition = "AND"
paths = ['''^scripts/release\-config\.sh$''']
regexTarget = "match"
regexes = ['''^SHAAR_SPARKLE_PUBLIC_ED_KEY=mAZzywTpmIBYZQRU9LERPRlNASVCm8X31EF9ZmDYX9Y=$''']

# BEGIN storage_keychain manifest digests
[[allowlists]]
description = "Storage-keychain source file integrity hashes in the source-build manifest"
condition = "AND"
paths = ['''^ThirdParty/ChromiumEngine/source-build\.json$''']
regexTarget = "secret"
regexes = ['''^[a-f0-9]{64}$''']
# END storage_keychain manifest digests
[[allowlists]]
description = "Known public private-window fixture extension identity key"
condition = "AND"
paths = ['''^Tests/Fixtures/PrivatePrivacyExtension/manifest\.json$''']
regexTarget = "match"
regexes = ['''^key":\ "MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA6eJ8yffTgqiny/Tnkjy5CNi3uX2CyE7b2mkhKRoSzu3j4DApFGL3V2zMkA0zRqmxxaWd0FXHp3IGqPjrzzP/CrMdWpL16iB39AC/9sOsyChQEDagtU\+miaK5P37kdBSixyc4Cg9t7YtK80eFVNxtxM84OvrnTNmCQbP1rB6Ue\+mUBBLuSOxj4hQgv6r7IUfQ3J8kQCAzz5jUubERHCYQlgDzwrquH3gzXLKibuYqdEGvoLmmh/a98Qzhz/TJvuIdVi5t/pv89EQc7PQGZuhVMrajiaQaxblTnpv1ICv7CTZ3nfLF5WQbwizt9id\+kWlU3HNJDt3maTj1aybwlujTvQIDAQAB"$''']
